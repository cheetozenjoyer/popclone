name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: build popclone
        run: ./gradlew :app:assembleDebug

      - name: name the apk
        env:
          TAG: ${{ github.ref_name }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "popclone-$TAG.apk"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: popclone-${{ github.ref_name }}.apk
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
