name: build apk

# run it by hand: github, actions tab, build apk, run workflow
on:
  workflow_dispatch:
    inputs:
      idcheck:
        description: also build the idcheck test app
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: build popclone
        run: ./gradlew :app:assembleDebug

      - name: name the apk
        run: cp app/build/outputs/apk/debug/app-debug.apk popclone-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: popclone-debug
          path: popclone-debug.apk

      - name: build idcheck
        if: ${{ inputs.idcheck }}
        run: |
          ./gradlew -p tools/idcheck :app:assembleDebug
          cp tools/idcheck/app/build/outputs/apk/debug/app-debug.apk idcheck-debug.apk

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.idcheck }}
        with:
          name: idcheck-debug
          path: idcheck-debug.apk
