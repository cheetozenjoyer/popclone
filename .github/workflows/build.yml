name: build apk

on:
  workflow_dispatch:
    inputs:
      idcheck:
        description: also build the idcheck test app
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: build popclone
        run: ./gradlew :app:assembleDebug

      - name: name the apk
        run: cp app/build/outputs/apk/debug/app-debug.apk popclone-debug.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: popclone-debug
          path: popclone-debug.apk

      - name: build waydroid only popclone
        run: |
          ./gradlew :app:assembleDebug -Pbridge
          cp app/build/outputs/apk/debug/app-debug.apk popclone-waydroid-only-debug.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: popclone-waydroid-only-debug
          path: popclone-waydroid-only-debug.apk

      - name: build idcheck
        if: ${{ inputs.idcheck }}
        run: |
          ./gradlew -p tools/idcheck :app:assembleDebug
          cp tools/idcheck/app/build/outputs/apk/debug/app-debug.apk idcheck-debug.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ inputs.idcheck }}
        with:
          name: idcheck-debug
          path: idcheck-debug.apk
