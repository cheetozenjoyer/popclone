plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.popclone'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.popclone'
        minSdk 26
        targetSdk 30
        versionCode 1
        versionName '0.1'
    }

    // release signing comes from env vars, only set in the release workflow
    signingConfigs {
        release {
            if (System.getenv('POPCLONE_KEYSTORE')) {
                storeFile file(System.getenv('POPCLONE_KEYSTORE'))
                storePassword System.getenv('POPCLONE_STORE_PASSWORD')
                keyAlias System.getenv('POPCLONE_KEY_ALIAS')
                keyPassword System.getenv('POPCLONE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            if (System.getenv('POPCLONE_KEYSTORE')) signingConfig signingConfigs.release
        }
    }

    // lint rejects the hidden api use and old targetSdk the cloner is built on
    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
}
