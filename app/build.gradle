plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.popclone'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.popclone'
        minSdk 26
        targetSdk 30
        versionCode 3
        versionName '0.2.0'
    }

    // release signing comes from env vars, only set in the release workflow
    signingConfigs {
        release {
            if (System.getenv('POPCLONE_KEYSTORE')) {
                storeFile file(System.getenv('POPCLONE_KEYSTORE'))
                storePassword System.getenv('POPCLONE_STORE_PASSWORD')
                keyAlias System.getenv('POPCLONE_KEY_ALIAS')
                keyPassword System.getenv('POPCLONE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            if (System.getenv('POPCLONE_KEYSTORE')) signingConfig signingConfigs.release
        }
    }

    // lint rejects the hidden api use and old targetSdk the cloner is built on
    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// -Pbridge makes the apk arm64 only so an x86 host (waydroid) runs it through its arm translator.
// the file is never loaded, android just picks the process abi from the folder it sits in.
if (project.hasProperty('bridge')) {
    def stubDir = layout.buildDirectory.dir('bridge/jniLibs/arm64-v8a')
    def makeStub = tasks.register('makeBridgeStub') {
        outputs.dir(stubDir)
        doLast {
            def dir = stubDir.get().asFile
            dir.mkdirs()
            new File(dir, 'libbridge.so').text = 'stub'
        }
    }
    android.sourceSets.main.jniLibs.srcDir(layout.buildDirectory.dir('bridge/jniLibs'))
    android.packagingOptions.jniLibs.keepDebugSymbols.add('**/*.so')
    tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn makeStub }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
}
